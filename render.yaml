services:
  - type: web
    name: stock-practice-lab
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/stock-practice-data
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
